# Basic alert rules. They show up under Prometheus → Alerts.
# (No Alertmanager is included; add one if you want notifications.)
groups:
  - name: host-health
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.host }} is not reachable by Prometheus"

      - alert: HostDiskAlmostFull
        expr: |
          100 * (1 - node_filesystem_avail_bytes{job="node", fstype!~"tmpfs|overlay|squashfs"}
                   / node_filesystem_size_bytes{job="node", fstype!~"tmpfs|overlay|squashfs"}) > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }} {{ $labels.mountpoint }} is {{ $value | printf \"%.0f\" }}% full"

      - alert: HostHighLoad
        expr: |
          node_load5{job="node"}
            / on (instance) group_left
          count by (instance) (node_cpu_seconds_total{job="node", mode="idle"}) > 2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }} load is {{ $value | printf \"%.1f\" }}x its core count"

      - alert: ServiceInactive
        expr: node_systemd_unit_state{job="node", state="active"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} on {{ $labels.host }} is not active"
